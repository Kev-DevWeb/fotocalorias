name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # next-env.d.ts no está en el repo; Next lo genera
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint:core
      - run: npm test
